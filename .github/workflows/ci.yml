name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# FantasyKit is a Swift package resolved from GitHub at the version pinned in
# Package.resolved, so this checkout is all the build needs.
jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      # Schemes are not shared in the project; `-list` makes Xcode autocreate them.
      - name: Resolve schemes and packages
        run: xcodebuild -list -project SundayScaries.xcodeproj

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project SundayScaries.xcodeproj \
            -scheme SundayScaries \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E 'error:|warning:|BUILD (SUCCEEDED|FAILED)' || true
          grep -q 'BUILD SUCCEEDED' build.log

      # No test step: the project has no test target (Pass-1 inventory). Add one and
      # replace this comment with `xcodebuild test -scheme SundayScaries -destination
      # 'platform=iOS Simulator,name=iPhone 16 Pro'`.

  lint:
    name: Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install linters
        run: |
          brew list swiftlint >/dev/null 2>&1 || brew install swiftlint
          brew list swiftformat >/dev/null 2>&1 || brew install swiftformat
          swiftlint version && swiftformat --version
      - name: SwiftLint
        run: swiftlint lint --strict --baseline .swiftlint-baseline.json --reporter github-actions-logging
      - name: SwiftFormat (lint only)
        run: swiftformat --lint .
